name: Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main branch
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            {
              echo "## Prepare release"
              echo
              echo "This workflow must be run from \`main\`. Selected ref: \`${{ github.ref_name }}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate publishable package metadata
        run: node scripts/release/validate-publishable-packages.mjs
      - name: Record source commit and prepare branch
        id: source
        run: |
          main_sha="$(git rev-parse HEAD)"
          short_main_sha="$(git rev-parse --short=12 HEAD)"
          prepare_branch="prepare-release/${short_main_sha}"

          {
            echo "main_sha=$main_sha"
            echo "short_main_sha=$short_main_sha"
            echo "prepare_branch=$prepare_branch"
          } >> "$GITHUB_OUTPUT"
      - name: Run changeset version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec changeset version
      - name: Read release version
        id: release_version
        run: |
          release_version="$(node -p "require('./js/package.json').version")"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
      - name: Create release commit
        id: release_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${{ steps.source.outputs.prepare_branch }}"
          git add -A

          if git diff --cached --quiet; then
            echo "No release changes were generated by changeset version."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: Prepare release"
          release_sha="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/${{ steps.source.outputs.prepare_branch }}
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
      - name: Summarize empty release
        if: steps.release_commit.outputs.has_changes == 'false'
        run: |
          {
            echo "## Prepare release"
            echo
            echo "No release changes were generated by \`changeset version\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create release PR
        if: steps.release_commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_MAIN_SHA: ${{ steps.source.outputs.main_sha }}
        run: |
          node <<'NODE' > release-packages.md
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");
          const paths = execFileSync(
            "git",
            ["diff", "--name-only", process.env.SOURCE_MAIN_SHA, "HEAD", "--", "**/package.json", "package.json"],
            { encoding: "utf8" },
          )
            .trim()
            .split("\n")
            .filter(Boolean);
          const packages = paths
            .map((path) => ({ path, manifest: JSON.parse(fs.readFileSync(path, "utf8")) }))
            .filter(({ path, manifest }) => {
              const previous = JSON.parse(
                execFileSync("git", ["show", `${process.env.SOURCE_MAIN_SHA}:${path}`], { encoding: "utf8" }),
              );
              return manifest.version !== previous.version;
            })
            .map(({ manifest }) => `- \`${manifest.name}\`: \`${manifest.version}\``)
            .sort();

          if (packages.length === 0) {
            throw new Error("No package version changes found for the release PR.");
          }

          process.stdout.write(`${packages.join("\n")}\n`);
          NODE

          {
            echo "Prepares a release by updating package versions, changelogs, and consumed changeset files."
            echo
            echo "## Packages"
            echo
            cat release-packages.md
            echo
            echo "Source-main-sha: ${{ steps.source.outputs.main_sha }}"
          } > release-pr-body.md

          pr_url="$(gh pr create \
            --base main \
            --head "${{ steps.source.outputs.prepare_branch }}" \
            --title "chore: Prepare release v${{ steps.release_version.outputs.version }} (${{ steps.source.outputs.short_main_sha }})" \
            --body-file release-pr-body.md)"

          {
            echo "## Prepare release"
            echo
            echo "Created release PR: $pr_url"
            echo
            echo "To publish this release, run the \`Publish Stable Release\` workflow with:"
            echo
            echo "\`\`\`text"
            echo "release_sha: ${{ steps.release_commit.outputs.release_sha }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
