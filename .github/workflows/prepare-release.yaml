name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to prepare (defaults to the selected workflow branch)
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: prepare-release-${{ inputs.source_branch || github.ref_name }}
  cancel-in-progress: false

env:
  SOURCE_BRANCH: ${{ inputs.source_branch || github.ref_name }}
  HUSKY: "0"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.checkout.outputs.commit }}
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Validate source branch
        run: git check-ref-format "refs/heads/$SOURCE_BRANCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
          ref: refs/heads/${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate publishable package metadata
        run: node scripts/release/validate-publishable-packages.mjs
      - name: Run changeset version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec changeset version
      - name: Save release changes
        id: patch
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No release changes were generated by changeset version." >> "$GITHUB_STEP_SUMMARY"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --cached --binary > "$RUNNER_TEMP/version.patch"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.patch.outputs.has_changes == 'true'
        with:
          name: release-changes
          path: ${{ runner.temp }}/version.patch
          retention-days: 1
          if-no-files-found: error

  open-release-pr:
    needs: prepare-release
    if: needs.prepare-release.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-changes
          path: ${{ runner.temp }}/release
      - name: Create release commit and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source_sha }}
        run: |
          git check-ref-format "refs/heads/$SOURCE_BRANCH"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "refs/remotes/origin/$SOURCE_BRANCH"
          short_sha="$(git rev-parse --short=12 "$SOURCE_SHA")"
          prepare_branch="prepare-release/$SOURCE_BRANCH-$short_sha"

          # Build the release tree in the index without checking out source-branch files.
          git read-tree "$SOURCE_SHA"
          git apply --cached "$RUNNER_TEMP/release/version.patch"
          release_version="$(git show :js/package.json | jq -er .version)"
          if [[ "$SOURCE_BRANCH" =~ ^v([0-9]+)$ && "${release_version%%.*}" != "${BASH_REMATCH[1]}" ]]; then
            echo "SDK version $release_version does not match maintenance branch $SOURCE_BRANCH." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release_sha="$(git commit-tree "$(git write-tree)" -p "$SOURCE_SHA" -m "chore: Prepare release")"
          node <<'NODE' > "$RUNNER_TEMP/release-packages.md"
          const { execFileSync } = require("node:child_process");
          const paths = execFileSync(
            "git",
            ["diff", "--name-only", "--cached", process.env.SOURCE_SHA, "--", "**/package.json", "package.json"],
            { encoding: "utf8" },
          )
            .trim()
            .split("\n")
            .filter(Boolean);
          const packages = paths
            .map((path) => ({ path, manifest: JSON.parse(execFileSync("git", ["show", `:${path}`], { encoding: "utf8" })) }))
            .filter(({ path, manifest }) => {
              const previous = JSON.parse(
                execFileSync("git", ["show", `${process.env.SOURCE_SHA}:${path}`], { encoding: "utf8" }),
              );
              return manifest.version !== previous.version;
            })
            .map(({ manifest }) => `- \`${manifest.name}\`: \`${manifest.version}\``)
            .sort();

          if (packages.length === 0) {
            throw new Error("No package version changes found for the release PR.");
          }

          process.stdout.write(`${packages.join("\n")}\n`);
          NODE

          {
            echo "Prepares a release by updating package versions, changelogs, and consumed changeset files."
            echo
            echo "## Packages"
            echo
            cat "$RUNNER_TEMP/release-packages.md"
            echo
            echo "Source-sha: $SOURCE_SHA"
          } > "$RUNNER_TEMP/release/body.md"

          git push origin "$release_sha:refs/heads/$prepare_branch"

          pr_url="$(gh pr create \
            --base "$SOURCE_BRANCH" \
            --head "$prepare_branch" \
            --title "chore: Prepare release v$release_version ($short_sha)" \
            --body-file "$RUNNER_TEMP/release/body.md")"

          {
            echo "## Prepare release"
            echo
            echo "Created release PR: $pr_url"
            echo
            echo "To publish this release, run the \`Publish Release\` workflow with:"
            echo
            echo "\`\`\`text"
            echo "source_branch: $SOURCE_BRANCH"
            echo "release_sha: $release_sha"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
