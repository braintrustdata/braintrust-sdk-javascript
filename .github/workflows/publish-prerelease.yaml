name: Publish Prerelease Snapshot

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to snapshot
        required: true
        default: main
        type: string

concurrency:
  group: publish-prerelease-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Resolve snapshot ref
        id: release
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-prerelease:
    needs: resolve-ref
    permissions:
      contents: write
      issues: write
      id-token: write
      pull-requests: read
      attestations: write
    uses: ./.github/workflows/publish-stable-release.yaml
    with:
      release_sha: ${{ needs.resolve-ref.outputs.release_sha }}
      prerelease: true
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  notify-failure:
    needs:
      - resolve-ref
    if: |
      always() &&
      needs.resolve-ref.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Slack on failure
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: C0ABHT0SWA2
            text: "🚨 Prerelease snapshot failed"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "🚨 Prerelease snapshot failed"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Workflow:* `Publish Prerelease Snapshot`\n*Ref:* `${{ inputs.ref }}`\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
