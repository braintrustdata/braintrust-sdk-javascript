packages:
  - e2e
  - js
  - dev-packages/*
  - integrations/*
  - js/src/wrappers/*
  - "!js/vendor/**"

blockExoticSubdeps: true
minimumReleaseAge: 4320 # 3 days (in minutes)
trustPolicy: no-downgrade
# Ignore the check for packages published more than 30 days ago (pnpm 10.27+)
# Useful for older packages that pre-date provenance support
trustPolicyIgnoreAfter: 43200 # minutes (30 days)
ignoredBuiltDependencies:
  - "@swc/core"
  - esbuild
  - msw
  - protobufjs
overrides:
  "handlebars": "^4.7.10"
  "protobufjs": "^7.6.5"
  "body-parser@>=2.0.0 <2.3.0": "^2.3.0"
  "brace-expansion@>=3.0.0 <5.0.12": "^5.0.12"
  "esbuild": "0.28.1"
  "uuid": "11.1.1"
  "router@2.2.0>path-to-regexp": "8.4.0"
  "express@5.2.1>qs": "6.16.0"
  "qs@>=6.7.0 <6.16.0": "^6.16.0"
  "tar@>=7.0.0 <7.5.21": "^7.5.21"
  "tar@>=6.0.0 <7.0.0": "^6.2.1"
  "flatted@<3.4.2": "^3.4.2"
  "markdown-it@>=13.0.0 <14.1.1": "^14.1.1"
  "@mikro-orm/knex@>=6.0.0 <6.6.14": "^6.6.14"
  "glob@>=10.2.0 <10.5.0": "^10.5.0"
  "fast-uri@<3.1.8": "^3.1.8"
  "linkify-it@<5.0.2": "^5.0.2"
  "@hono/node-server@<1.19.15": "^1.19.15"
  "nanoid@<3.3.18": "^3.3.18"
  "postcss@<8.5.23": "^8.5.23"
  "js-yaml@3": "^3.15.1"
  "js-yaml@4": "^4.3.1"
  "@opentelemetry/core@2": "^2.8.0"
  "@ai-sdk/provider-utils": "^4.0.33"
  "brace-expansion@<1.1.21": "^1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "^2.1.7"
  "ip-address@<10.7.1": "^10.7.1"
  "hono@<4.13.7": "^4.13.7"
  "@grpc/grpc-js@>=1.14.0 <1.14.5": "^1.14.5"
  "@modelcontextprotocol/sdk@>=1.12.0 <1.31.0": "^1.31.0"
  "smol-toml@<1.9.0": "^1.9.0"
  "source-map-js@<1.2.2": "^1.2.2"
  "proxy-addr@<2.0.8": "^2.0.8"
  vite@*: "catalog:"
  vitest@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
